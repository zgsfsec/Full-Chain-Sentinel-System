          content:
            application/json:
              schema: { x-schema: Http.MitmStorage }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/flows:
    get:
      tags: [MITM 与 WebFuzz]
      summary: 流量记录列表
      description: "筛选参数都是可选的，组合使用时取交集。`nextCursor` 不为 `null` 时把它原样作为 `cursor` 传回来取下一页；同一组筛选条件下翻页，响应里的 `total` 取自缓存，新抓到的记录可能还没算进去，`totalCached` 说明是不是缓存值，`totalUpdatedAt` 是缓存的更新时间（毫秒时间戳）；带 `refreshCount=1` 会重新统计。项目隐藏的域名（见 `/api/mitm/host-filter`）不出现在结果里，也不计入 `total`。"
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
          example: 1
          description: 页码，从 1 开始。和 `cursor` 同时给时只用 `cursor`。
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
          example: 50
          description: 每页条数，最大 50。
        - name: q
          in: query
          schema: { type: string }
          example: login
          description: 在主机、路径和查询串里做不区分大小写的子串匹配。
        - name: host
          in: query
          schema: { type: string }
          example: example.com
          description: 主机名的子串。
        - name: path
          in: query
          schema: { type: string }
          example: /api/login
          description: 路径的子串。
        - name: since
          in: query
          schema: { type: integer, minimum: 0 }
          example: 1763942400000
          description: 只要这个时间（毫秒时间戳）之后的记录。
        - name: until
          in: query
          schema: { type: integer, minimum: 0 }
          example: 1764028800000
          description: 只要这个时间（毫秒时间戳）之前的记录。
        - name: method
          in: query
          schema: { type: string }
          example: POST
          description: 请求方法，不区分大小写。
        - name: status
          in: query
          schema: { type: string, enum: ["1xx", "2xx", "3xx", "4xx", "5xx", error] }
          example: "2xx"
          description: 按状态码筛选：三位状态码（如 `200`）、一位加 `xx`（如 `2xx`），或 `error` 表示出错的请求。
        - name: refreshCount
          in: query
          schema: { type: string, enum: ["1"] }
          example: "1"
          description: "为 `1` 时不用缓存的记录总数，重新统计。"
        - name: cursor
          in: query
          schema: { type: string }
          example: MTc2Mzk0MjQwMDAwMF9mMWEyYjNjNA
          description: 上一页响应里的 `nextCursor`，原样带回。
      responses:
        "200":
          description: "一页流量记录。`items` 每项有 `id`、`ts`（毫秒时间戳）、`method`、`scheme`、`host`、`port`、`path`、`query`、`status`（没拿到响应时是 `null`）、`durationMs`、`reqSize`、`respSize`、`error`（`null` 表示没有）和 `note`；`total`、`page`、`pageSize` 是分页信息，`nextCursor` 是取下一页用的游标，没有下一页时是 `null`。"
          content:
            application/json:
              schema: { x-schema: Http.MitmFlows }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/host-filter:
    get:
      tags: [MITM 与 WebFuzz]
      summary: 不在流量记录里显示的域名
      description: "名单里的域名不出现在流量记录列表里，也不计入 `total`：`GET /api/mitm/flows` 已经排除了它们，Agent 的 `mitm_flows` 工具同样。流量照常抓取和保存，按 ID 读取一条记录不受影响。写完整域名（如 `hahah.test.com`）只隐藏它自己；以 `*.` 开头（如 `*.test.com`）隐藏该域名下的全部子域名，域名本身不隐藏。"
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "当前项目的名单。`hosts` 是存下来的写法：小写、排序、没有重复；没有名单时是空数组。"
          content:
            application/json:
              schema: { x-schema: Http.MitmHostFilter }
              example: { hosts: [hahah.test.com, "*.cdn.test.com"] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
    post:
      tags: [MITM 与 WebFuzz]
      summary: 替换不在流量记录里显示的域名名单
      description: "整份替换，`hosts` 为空数组时清空。每一项是一个域名：小写字母、数字、`-`、`_` 和分隔用的 `.`，最多 500 项；以 `*.` 开头表示该域名下的全部子域名。服务端按统一写法存下来并原样返回，立即对流量列表生效，代理不重启。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.MitmHostFilterInput }
            example:
              projectId: project-1
              hosts: [hahah.test.com, "*.cdn.test.com"]
      responses:
        "200":
          description: "存下来的名单。"
          content:
            application/json:
              schema: { x-schema: Http.MitmHostFilter }
              example: { hosts: ["*.cdn.test.com", hahah.test.com] }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/flows/{flowId}:
    get:
      tags: [MITM 与 WebFuzz]
      summary: 一条流量记录
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/flowId"
      responses:
        "200":
          description: "一条流量记录。在列表项的字段之外有 `reqHeaders`、`respHeaders`（`name` 和 `value` 的数组）和 `request`、`response` 两个正文对象（抓到的文本、编码、是否截断等）。"
          content:
            application/json:
              schema: { x-schema: Http.MitmFlow }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/flows/{flowId}/{part}:
    get:
      tags: [MITM 与 WebFuzz]
      summary: 一条流量记录的原始报文
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/flowId"
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [request, response] }
          example: request
      responses:
        "200":
          description: 原始报文，文件流。
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/flows/delete:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 删除选中的流量记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, confirm, ids]
              properties:
                confirm:
                  type: boolean
                  description: "必须是 `true`。"
                ids:
                  type: array
                  items: { type: string }
                  description: 要删除的流量记录的 ID。
            example: { projectId: project-1, confirm: true, ids: [f1a2b3c4] }
      responses:
        "200":
          description: 删了多少条。
          content:
            application/json:
              schema:
                type: object
                required: [ok, deleted]
