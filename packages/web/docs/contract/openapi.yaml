        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/ca.crt:
    get:
      tags: [MITM 与 WebFuzz]
      summary: 下载 HTTPS 解密证书（DER 格式）
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "DER 格式的证书，文件下载。代理启动过一次之后才有证书，之前回 `404`。"
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/webfuzz:
    get:
      tags: [MITM 与 WebFuzz]
      summary: WebFuzz 工作台的状态
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "工作台状态。`tabs` 是各个标签的请求草稿（`id`、`name` 和 `Http.WebFuzzSendInput` 里 `request` 的各字段），`activeId` 是当前标签的 ID，没有标签时是 `null`；`history` 是最近 30 次发送的结果，字段同 `/api/mitm/webfuzz/send` 的响应。"
          content:
            application/json:
              schema: { x-schema: Http.WebFuzzState }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/webfuzz/workspace:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 保存 WebFuzz 工作台
      description: "保存全部标签的草稿，整个工作台一起覆盖。最多 20 个标签，`activeId` 必须是其中一个标签的 ID 或 `null`。请求体上限 16 MB。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.WebFuzzWorkspaceInput }
            example:
              projectId: project-1
              activeId: tab-1
              tabs:
                - id: tab-1
                  name: 未命名请求
                  raw: |-
                    GET / HTTP/1.1
                    Host: example.com
                  target: http://example.com:80
                  route: project
                  timeoutMs: 30000
                  insecureTLS: false
                  fixContentLength: true
      responses:
        "200":
          description: 已保存。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/webfuzz/import:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 把一条流量记录带进 WebFuzz
      description: 按流量记录的请求生成一个草稿，前端拿它新建一个标签。请求或响应是二进制、或抓取时被截断的记录带不进来。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, flowId]
              properties:
                projectId: { type: string }
                flowId: { type: string, description: 要带进来的流量记录的 ID。 }
            example: { projectId: project-1, flowId: f1a2b3c4 }
      responses:
        "200":
          description: 生成的请求草稿，字段和 `/api/mitm/webfuzz/send` 请求体里的 `request` 相同：`raw`、`target`、`route`、`timeoutMs`、`insecureTLS`、`fixContentLength`。
          content:
            application/json:
              schema: { x-schema: Http.WebFuzzRequest }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/webfuzz/send:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 发送一个原始 HTTP 请求
      description: "真的会访问目标。`request` 是一个对象：`raw` 是原始 HTTP 请求报文，`target` 是目标地址（只有协议、主机和端口，路径写在请求行里），`route` 是出口（`project` 走项目容器，`direct` 直连，`mitm` 经过本项目的 MITM 代理），`timeoutMs` 是超时（1000–120000 毫秒），`insecureTLS` 是否跳过证书校验，`fixContentLength` 是否按正文重算 `Content-Length`。`password` 是走 `mitm` 出口时代理的访问密码。一个项目最多同时发 4 个请求。请求体上限 4 MB。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.WebFuzzSendInput }
            example:
              projectId: project-1
              request:
                raw: |-
                  GET / HTTP/1.1
                  Host: example.com
                  Accept: */*
                  Connection: close
                target: http://example.com:80
                route: project
                timeoutMs: 30000
                insecureTLS: false
                fixContentLength: true
      responses:
        "200":
          description: "发送结果。`request` 是实际发出的请求；`response` 是响应（`proto`、`status`、`reason`、`headers`、`bodyText`、`rawText`、`truncated`、`size` 等），没有拿到响应时是 `null`；`timings` 是连接、TLS、首字节和总耗时（毫秒）；`warnings` 是警告；`error` 在失败时给出原因；`id` 和 `at`（毫秒时间戳）标识这一次发送。"
          content:
            application/json:
              schema: { x-schema: Http.WebFuzzReplayResult }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MitmNoRoute"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: 当前项目同时发送的请求太多，最多 4 个。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/intelligence/sources:
    get:
      tags: [威胁情报]
      summary: 情报数据源列表
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "数据源的数组，每项有 `id`、`projectId`、`name`、`enabled`、`createdAt`（毫秒时间戳）和最近一次收到推送的时间 `lastReceivedAt`（没有时是 `null`）。推送令牌不返回。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceSources }
    post:
      tags: [威胁情报]
      summary: 新建数据源
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120, description: 数据源的名字。 }
            example: { name: 内部告警源 }
      responses:
        "200":
          description: "`source` 是新建的数据源；`token` 是它的推送令牌，以 `intel_` 开头，只在这一次返回，数据源用它调用 `POST /api/intelligence/v1/ingest`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceSourceCreate }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/intelligence/sources/{id}:
    post:
      tags: [威胁情报]
      summary: 启停数据源，或轮换它的令牌
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: 3d5c1a2e-9b4d-4c2a-9f1e-2d3c4b5a6978
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, rotate]
              properties:
                enabled: { type: boolean, description: 数据源启用还是停用。 }
                rotate: { type: boolean, description: "为 `true` 时换一个新的推送令牌，旧令牌立即失效。" }
            example: { enabled: true, rotate: true }
      responses:
        "200":
          description: "`rotate` 为 `true` 时返回新的推送令牌，形如 `{ \"token\": \"intel_…\" }`；否则返回空对象 `{}`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceSourceUpdate }

  /api/intelligence/policy:
    get:
      tags: [威胁情报]
      summary: 项目的情报策略
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "策略。`enabled` 为 `false` 时不做分析；`threshold`、`batchSize`、`concurrency`、`cooldownMinutes` 的含义见保存接口；`template` 是分析用的指挥思路（`id`、`name`、`prompt`）和它的限制 `limits`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligencePolicy }
    post:
      tags: [威胁情报]
      summary: 保存项目的情报策略
      description: |-
        `enabled` 关闭时不做分析。`threshold` 是攒够多少条告警才开一个批次（1–200），`batchSize` 是一个批次
        最多覆盖多少个 IP（不小于 `threshold`，最大 200），`concurrency` 是同时分析的批次数（1–8），
        `cooldownMinutes` 是同一个 IP 两次分析之间至少间隔的分钟数。

        `template.id` 是分析用的指挥思路的 ID，从 `/api/intelligence/doctrines` 里选，它的名称和提示词由服务端填好、
        不用传。`template.limits` 是每个分析工程的限制：`concurrency`（1–8）、`roundLimit`（1–99）、`tokenLimit` 和
        `timeLimitMin`（`null` 表示不限，否则分别是 1–10000000 和 1–1440）。

        保存后立刻尝试开始一轮分析。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.IntelligencePolicyInput }
            example:
              enabled: false
              threshold: 20
              batchSize: 50
              concurrency: 1
              cooldownMinutes: 1440
              template:
                id: threat-ip-analysis
                limits: { concurrency: 1, roundLimit: 5, tokenLimit: null, timeLimitMin: 30 }
      responses:
        "200":
          description: 保存后的策略。
          content:
            application/json:
              schema: { x-schema: Http.IntelligencePolicy }

  /api/intelligence/doctrines:
    get:
      tags: [威胁情报]
      summary: 内置的判定思路
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "指挥思路的数组，每项有 `id`、`name`、`text`（提示词全文）和 `builtin`（是否内置）。保存策略时 `template.id` 从这里选。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceDoctrines }

  /api/intelligence/guide:
    get:
      tags: [威胁情报]
      summary: 给情报分析 Agent 的接口说明
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: 说明文本。
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
              example:
                text: "你是情报分析工程，输入是设备上报的告警……"

  /api/intelligence/ips:
    get:
      tags: [威胁情报]
      summary: 情报指标（IP）列表
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: search
          in: query
          schema: { type: string, maxLength: 80 }
          example: 203.0.113
          description: 按 IP 的子串匹配。
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: "一页指标，每页 50 条。`items` 每个 IP 一项：`ip`、`status`（`pending`、`attention`、`processing`、`cooling`、`processed`）、`count`（告警条数）、`pending`（还没分析的条数）、`firstSeen` 和 `lastSeen`（毫秒时间戳）、`cooldownUntil`、`sources`（上报过它的数据源）和 `batchId`（处理它的批次，没有时是 `null`）；另有 `total`、`page`、`pageSize`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceIndicators }

  /api/intelligence/alerts:
    get:
      tags: [威胁情报]
      summary: 告警列表
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: ip
          in: query
          required: true
          schema: { type: string }
          example: 203.0.113.7
          description: 只看这个 IP 的告警。必须带，不带会回 `400`。
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: "一页告警，每页 50 条。`items` 每项有 `event_id`、`indicator`（`{ type: \"ip\", value }`）、`occurred_at`（数据源报告的时间，ISO 8601）、`receivedAt`（服务端收到的时间，毫秒时间戳）、`category`、`severity`（`info`、`low`、`medium`、`high`、`critical`）、`seq`，以及来源 `sourceId` 和 `sourceName`；另有 `total`、`page`、`pageSize`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceAlerts }

  /api/intelligence/batches:
    get:
      tags: [威胁情报]
      summary: 分析批次列表
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: "一页批次，每页 20 条。`items` 每项是一个批次的概要（`id`、`status`、`createdAt`、`policy`、`template`、`attempts`）加上它覆盖的 IP 数 `ipCount`；另有 `total`、`page`、`pageSize`。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceBatches }

  /api/intelligence/batches/{id}:
    get:
      tags: [威胁情报]
      summary: 一个分析批次的详情
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: batch-1
      responses:
        "200":
          description: "批次的详情：`id`、`projectId`、`status`（`queued`、`creating`、`running`、`paused`、`succeeded`、`failed`、`aborted`、`discarded`）、`createdAt`（毫秒时间戳）、`policy`、`template`、`items`（每个 IP 的告警，含 `alerts`）和 `attempts`（每次尝试的状态、对应的工程 `engineId` 和失败原因 `error`）。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceBatch }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/intelligence/batches/{id}/{action}:
    post:
      tags: [威胁情报]
      summary: 对一个分析批次执行操作
      description: |-
        `action` 是路径的最后一段：

        | `action` | 作用 | 什么时候可用 |
        | --- | --- | --- |
        | `retry` | 重新排队分析 | 已结束的批次 |
        | `discard` | 丢弃这个批次 | 已结束的批次 |
        | `abort` | 终止正在跑的工程 | 进行中的批次 |
        | `pause` | 暂停工程 | 进行中，且已有工程 |
        | `resume` | 恢复工程 | 进行中，且已有工程 |

        请求体必须是一个 JSON 对象，内容不读，发 `{}` 即可。
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: batch-1
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [retry, discard, abort, pause, resume] }
          example: pause
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: {}
      responses:
        "200":
          description: 已执行。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "批次还在进行中，不能 `retry` 或 `discard`；批次已结束，不能 `abort`、`pause`、`resume`；或者没有可以暂停、恢复的工程。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/intelligence/clear:
    post:
      tags: [威胁情报]
      summary: 清空当前项目的情报
      description: 删除这个项目收到的全部告警、指标和批次。数据源和策略保留。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmProjectId]
              properties:
                confirmProjectId:
                  type: string
                  description: "必须等于查询参数里的 `projectId`，防止清空别的项目。"
            example: { confirmProjectId: project-1 }
      responses:
        "200":
          description: 已清空。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/intelligence/cleanup:
    post:
      tags: [威胁情报]
      summary: 清理过期的情报
      description: 删除符合条件的告警和指标。三个条件都可以省略，都省略时清理全部。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntelligenceCleanup" }
            example: { before: 1761964800000 }
      responses:
        "200":
          description: "清理结果：`events` 是删掉的告警条数，`blockedBatches` 是因为有进行中的批次而没动的 IP 数。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceCleanupResult }

  /api/intelligence/cleanup/preview:
    post:
      tags: [威胁情报]
      summary: 预览会清理掉哪些情报
      description: 只统计，不删除。请求体和响应与 `POST /api/intelligence/cleanup` 相同。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntelligenceCleanup" }
            example: { before: 1761964800000 }
      responses:
        "200":
          description: 预览结果。
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceCleanupResult }

  /api/security-checks:
    get:
      tags: [安全检查]
      summary: 安全检查的规则摘要和数据源
      responses:
        "200":
          description: "`rules` 是规则的摘要数组（`id`、`ruleId`、`sourceId`、`name`、`category`、`description`、`version`、`path`、`commit`、`copiedFrom`），不含正文 `text`，正文用 `GET /api/security-checks/rule` 取；`sources` 是规则数据源的数组（`id`、`name`、`repository`、`branch`、`directory`、`enabled`、`intervalHours`、`syncing`、`lastCheckedAt`、`lastSuccessAt`、`nextSyncAt`、`commit`、`error`、`failures`）。"
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckRules }
        "403":
          description: "未授权，或请求的 `Origin` 和主机不一致。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/security-checks/rule:
    get:
      tags: [安全检查]
      summary: 一条规则的全文
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          example: "local:example-rule"
          description: 规则的 ID。自己写的规则是 `local:<规则 ID>`，同步来的规则是 `<数据源 ID>:<规则 ID>`。
      responses:
        "200":
          description: "规则，在摘要的字段之外多了正文 `text`。"
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckRule }

  /api/security-checks/history:
    get:
      tags: [安全检查]
      summary: 同步历史
      parameters:
        - name: sourceId
          in: query
          schema: { type: string }
          example: 3d5c1a2e-9b4d-4c2a-9f1e-2d3c4b5a6978
          description: 数据源的 ID。不传时返回空列表。
      responses:
        "200":
          description: "同步历史，最多 20 条，从新到旧。每项有 `ok`（是否成功）、`count`（这次同步拉到或更新的规则数）、`message`（说明）和 `at`（毫秒时间戳）。"
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckHistoryList }

  /api/security-checks/rules/save:
    post:
      tags: [安全检查]
      summary: 新建或修改一条规则
      description: |-
        `markdown` 是规则全文：开头是 YAML 文件头（`---` 之间），后面是正文。文件头四个字段：

        | 字段 | 必填 | 说明 |
        | --- | --- | --- |
        | `id` | 是 | 规则 ID，字母、数字、点、下划线、短横线，以字母或数字开头，最长 128 |
        | `name` | 是 | 规则名称，最长 128 |
        | `category` | 是 | 分类，逗号分隔，最多 16 个，每个是用 `/` 分层的路径 |
        | `description` | 否 | 简介，最长 1024 |

        保存后的规则 ID 是 `local:<id>`。不带 `id` 和 `version` 是新建，文件头的 `id` 已存在会回 `400`；
        带上要修改的规则的 `id` 和它的 `version` 是修改，文件头里的 `id` 不能变。从同步规则复制出来时带 `copiedFrom`。
        规则全文最大 128 KB，请求体上限 2 MB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown: { type: string, maxLength: 163840, description: 规则全文，带 YAML 文件头的 Markdown。 }
                id: { type: string, description: 修改时，要修改的规则的 ID。 }
                version: { type: string, description: 修改时，打开规则时拿到的版本号。 }
                copiedFrom: { type: string, description: 从哪条同步规则复制来的。 }
            example:
              markdown: |-
                ---
                id: example-rule
                name: 示例检查规则
                category: Web/配置
                description: 检查示例配置是否安全。
                ---

                # 示例检查规则

                检查目标的示例配置项，记录发现的问题。
      responses:
        "200":
          description: 保存后的规则，`version` 是内容哈希，修改或删除时要带回。
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckRule }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/security-checks/rules/delete:
    post:
      tags: [安全检查]
      summary: 删除一条规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, version]
              properties:
                id: { type: string, description: 规则的 ID，形如 `local:example-rule`。 }
                version: { type: string, description: 打开规则时拿到的版本号。规则在那之后变过就不删。 }
            example: { id: "local:example-rule", version: "<规则的 version>" }
      responses:
        "200":
          description: 已删除。同步来的规则不能在这里删，回 `400`。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/security-checks/sources/save:
    post:
      tags: [安全检查]
      summary: 保存一个规则数据源
      description: 不带 `id` 是新建，带上是修改。`repository` 只接受 `https://github.com/所有者/仓库`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.SecurityCheckSourceInput }
            example:
              name: 官方规则库
              repository: https://github.com/owner/security-rules
              branch: main
              directory: rules
              enabled: true
              intervalHours: 24
      responses:
        "200":
          description: 保存后的数据源。
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckSource }

  /api/security-checks/sources/delete:
    post:
      tags: [安全检查]
      summary: 删除一个规则数据源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: 数据源的 ID。 }
            example: { id: 3d5c1a2e-9b4d-4c2a-9f1e-2d3c4b5a6978 }
      responses:
        "200":
          description: 已删除，连同从它同步来的规则。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/security-checks/sync:
    post:
      tags: [安全检查]
      summary: 同步规则数据源
      description: "不带 `id` 时同步全部启用的、当前没有在同步的数据源。"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: 只同步这一个数据源。 }
            example: {}
      responses:
        "200":
          description: 每个数据源的成功或失败。`items` 每项有 `id` 和 `ok`，失败时有 `error`。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
              example:
                items:
                  - { id: 3d5c1a2e-9b4d-4c2a-9f1e-2d3c4b5a6978, ok: true }

  /api/security-checks/submit:
    post:
      tags: [安全检查]
      summary: 提交一次安全检查
      description: |-
        提交后新建一个安全检查工程并立即开始，进度和结果通过 WebSocket 的 `engines`、`engine_*` 等消息跟进。

        - `projectId`：在哪个项目里检查。
        - `requestId`：调用方生成的唯一 ID。同一个 `requestId` 重复提交返回同一个工程，不会重复执行；
          内容和第一次不同则回 `400`。
        - `rules`：选中的规则，每项带 `id` 和 `version`。规则在选中之后变过会回 `400`。
        - `input`：工程的设置，`name`（工程名称）和 `limits`（`concurrency`、`roundLimit`、`maxRetries`、
          `tokenLimit`、`timeLimitMin`）必填；可选 `targets`（每行一个目标）、`presetIds`、`presetOptional`、
          `gateMode`（`auto` 或 `ai`）、`recordWorkLinks`、`reportTemplateId` 和 `schedule`（定时计划）。
        - `credentials`：选中的凭据，每项带 `id` 和 `revision`，只作为本轮的检查目标。
        - `requirements`：本轮的补充要求。

        `targets`、`credentials`、`requirements` 至少要有一样。
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.SecurityCheckSubmitInput }
            example:
              projectId: project-1
              requestId: submit-1
              rules:
                - { id: "local:example-rule", version: "<规则的 version>" }
              input:
                name: 示例安全检查
                targets: 10.0.0.0/24
                presetOptional: true
                gateMode: auto
                limits: { concurrency: 1, roundLimit: 5, maxRetries: 0, tokenLimit: null, timeLimitMin: 60 }
              requirements: 重点检查暴露的管理入口
      responses:
        "200":
          description: "`engineId` 是新建的工程 ID。"
          content:
            application/json:
              schema: { x-schema: Http.SecurityCheckSubmitResult }

  /api/credentials:
    get:
      tags: [凭据]
      summary: 项目的凭据列表
      description: "只返回凭据的视图，不返回密码本身。请求的 `Origin` 必须和主机一致。"
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "`items` 是凭据的视图数组。每项有 `id`、`projectId`、`revision`、`status`、`validations`、`updatedAt`，凭据本身的字段（`name`、`group`、`type`、`host`、`port`、`username`、`database`、`instance`、`domain`、`manufacturer`、`model`、`notes`、`fields`），以及 `hasPassword`、`hasPrivateKey`、`hasPassphrase`、`hasToken` 四个是否设置的标记。密码、私钥、口令和令牌本身不返回。"
          content:
            application/json:
              schema: { x-schema: Http.CredentialList }
        "403":
          description: 项目不存在或未授权。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/credentials/save:
    post:
      tags: [凭据]
      summary: 新建或修改一条凭据
      description: 所有写操作的请求体上限 3 MB。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: object
                  additionalProperties: true
                  description: "凭据的内容，见 `Http.CredentialInput`：`type` 和 `host` 必填，其余可省略。"
                id: { type: string, description: 修改时，要修改的凭据的 ID。不带是新建。 }
                revision: { type: string, description: 修改时，凭据当前的版本号。凭据在那之后变过会回 `400`。 }
            example:
              input:
                name: 测试数据库
                group: 数据库
                type: MySQL
                host: 10.0.0.12
                port: 3306
                username: root
                password: example-password
      responses:
        "200":
          description: 保存后的凭据列表。
          content:
            application/json:
              schema: { x-schema: Http.CredentialList }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/credentials/import/preview:
    post:
      tags: [凭据]
      summary: 预览批量导入
      description: "返回的 `version` 要在正式导入时原样带回。"
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, content]
              properties:
                format: { type: string, enum: [json, csv], description: 导入文件的格式。 }
                content: { type: string, description: "文件的内容。JSON 是凭据对象的数组；CSV 第一行是字段名。" }
            example:
              format: json
              content: '[{ "type": "MySQL", "host": "10.0.0.12", "port": 3306, "username": "root", "password": "example-password" }]'
      responses:
        "200":
          description: "`items` 每项是一条凭据的视图（字段同凭据列表）加上 `operation`（`新增` 或 `更新`）；`version` 是当前凭据列表的版本号，正式导入时要原样带回。"
          content:
            application/json:
              schema: { x-schema: Http.CredentialImportPreview }

  /api/credentials/import/apply:
    post:
      tags: [凭据]
      summary: 正式批量导入
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, content, version]
              properties:
                format: { type: string, enum: [json, csv] }
                content: { type: string }
                version:
                  type: string
                  description: "预览时拿到的版本号。凭据在预览之后变过就回 `400`。"
            example:
              format: json
              content: '[{ "type": "MySQL", "host": "10.0.0.12", "port": 3306, "username": "root", "password": "example-password" }]'
              version: "<预览返回的 version>"
      responses:
        "200":
          description: 导入后的凭据列表。
          content:
            application/json:
              schema: { x-schema: Http.CredentialList }

  /api/credentials/confirm:
    post:
      tags: [凭据]
      summary: 确认凭据可用
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs]
              properties:
                refs:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: object, additionalProperties: true }
                  description: "要确认的凭据，每项带 `id` 和 `revision`，1–1000 条，不能重复。"
            example:
              refs:
                - { id: "<凭据的 id>", revision: "<凭据的 revision>" }
      responses:
        "200":
          description: 更新后的凭据列表。
          content:
            application/json:
              schema: { x-schema: Http.CredentialList }

  /api/credentials/delete:
    post:
      tags: [凭据]
      summary: 删除凭据
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
                  description: 要删除的凭据的 ID。
            example: { ids: ["<凭据的 id>"] }
      responses:
        "200":
          description: 已删除。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/credentials/delete-failed:
    post:
      tags: [凭据]
      summary: 删除验证失败的凭据
      description: "`confirm` 是失败记录的清单，服务端和当前的失败记录逐项比对，防止误删预览之后状态变过的记录。"
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: array
                  items: { type: string }
                  description: "要删除的失败记录的清单，每项是 `<id>:<revision>:<updatedAt>`。和当前的失败记录对不上会回 `400`，防止误删。"
            example: { confirm: ["<id>:<revision>:<updatedAt>"] }
      responses:
        "200":
          description: 删了多少条。
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
              example: { deleted: 1 }

  /api/intelligence/v1/ingest:
    post:
      tags: [非浏览器调用方]
      summary: 情报数据源推送指标
      description: "调用方是外部情报数据源，不是浏览器。在入口串和登录之前处理，用请求头 `Authorization: Bearer <令牌>` 鉴权，令牌由「新建数据源」给出。同时推送的数量有上限，超过时回 `429` 并带 `Retry-After: 60`。"
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
          example: Bearer intel_example
          description: "`Bearer` 加数据源的推送令牌，令牌在新建数据源或轮换令牌时返回。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.IntelligencePush }
            example:
              schema_version: 1
              request_id: req-20261124-0001
              events:
                - event_id: evt-0001
                  indicator: { type: ip, value: 203.0.113.7 }
                  occurred_at: "2026-11-24T07:00:00Z"
                  category: brute-force
                  severity: high
      responses:
        "200":
          description: "入库结果：`requestId` 原样带回；`accepted` 是入库的告警条数；`duplicates` 是 `event_id` 之前收到过的条数；`newIps` 是第一次见到的 IP 数。同一个 `request_id` 重复推送返回第一次的结果。"
          content:
            application/json:
              schema: { x-schema: Http.IntelligenceReceipt }
        "401":
          description: 令牌无效，或数据源已停用。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: 推送过于频繁。
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/ios/upload/{name}:
    post:
      tags: [非浏览器调用方]
      summary: iOS 设备上传文件
      description: 调用方是 iOS 设备上的 SentinelBridge，不是浏览器。在入口串和登录之前处理，用设备自己的令牌鉴权。设备上传的协议不在本契约里。
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: notes.txt
      responses:
        "200":
          description: 已接收。
        "4xx":
          description: 鉴权或请求不合格。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sentinel-gate:
      type: apiKey
      in: cookie
      name: sentinel-gate
      description: "打开入口地址 `/<入口串>` 时下发的 Cookie，值是入口串的 HMAC-SHA256。`Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000`。入口串每次启动都变，所以重启后要重新打开入口地址。"
    sentinel-auth:
      type: apiKey
      in: cookie
      name: sentinel-auth
      description: "登录后下发的会话 Cookie，值是 `<过期时间毫秒>.<HMAC>`。`Path=/; HttpOnly; SameSite=Strict`，勾选「记住登录」时带 `Max-Age=2592000`。只有最后一次登录有效。"

  parameters:
    projectId:
      name: projectId
      in: query
      required: true
      schema: { type: string }
      example: project-1
      description: "当前项目的 ID。必须是被选中的那个项目，`GET /api/assets/import` 可以拿到它。"
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
      example: 1
      description: 页码，从 1 开始。
    hostId:
      name: hostId
      in: path
      required: true
      schema: { type: string }
      example: host-1
      description: 插件主机的 ID。
    pluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
      example: plugin-example
      description: 插件的 ID。
    reportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "6f1c2a3e-8b4d-4c2a-9f1e-2d3c4b5a6978"
      description: 报告的 ID。
    kind:
      name: kind
      in: query
      required: true
      schema: { type: string, enum: [session, engine] }
      example: session
      description: 工作链路属于一次对话还是一个工程。
    workId:
      name: id
      in: query
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9._:-]{1,200}$" }
      example: session-1
      description: 对话或工程的 ID。
    flowId:
      name: flowId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9_-]{1,100}$" }
      example: f1a2b3c4
      description: 流量记录的 ID。

  responses:
    BadRequest:
      description: 请求不合格。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 请求不合格。 }
    Unauthorized:
      description: "没有会话 Cookie，或会话已失效。多数路由的正文是 `未登录`；读取请求体的过程中登录失效的，正文说明登录已失效，要重新登录。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 未登录 }
    ConsentRequired:
      description: "还没接受授权承诺。正文是 `consent_required`。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: consent_required }
    NotFound:
      description: 不存在。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 不存在。 }
    Conflict:
      description: 与当前状态冲突。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 与当前状态冲突，请刷新后重试。 }
    PayloadTooLarge:
      description: 请求体超过这条路由的上限。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 请求内容过大。 }
    UnsupportedMediaType:
      description: "请求头 `Content-Type` 不是 `application/json`。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 请发送 JSON 请求。 }
    MethodNotAllowed:
      description: 不支持这个请求方法。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 请求方法不支持。 }
    Internal:
      description: 服务端内部错误。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 服务端内部错误。 }
    ServiceUnavailable:
      description: 后端没有配置目录，对应的功能不可用。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 服务不可用。 }
    MitmInvalid:
      description: "请求体不是 JSON 对象，或者内容无效：配置、筛选条件、隐藏的域名、游标、要删除或导入的记录不合法，确认标志不是 `true`。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 请求格式错误。 }
    MitmNoRoute:
      description: 没有这个 MITM 接口，它不接受这个请求方法，或者要读的流量记录、原始报文、证书不存在。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 接口不存在或请求方法错误。 }
    MitmProjectChanged:
      description: "当前项目已被切换，或者 MITM 容器名被别的实例占用。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 当前项目已变更，请刷新页面。 }
    MitmUnavailable:
      description: "后端没有配置数据目录，或者没法检查 MITM 容器（Docker 不可用）。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: 控制台未配置数据目录。 }
    MitmFailed:
      description: MITM 操作失败，原因写在服务端日志里。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: MITM 操作失败，请检查服务日志。 }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: "给操作员看的完整句子，按当前界面语言生成，前端原样显示。前端要按内容识别的只有两个值：`未登录`（会话失效）和 `consent_required`（还没接受授权承诺）。"
      example: { error: 请求不合格。 }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[\w.-]{1,40}$'
          description: 字母、数字、点、下划线或连字符，1–40 个字符。
        password:
          type: string
          minLength: 8
          description: 至少 8 个字符。
    AssetImportRequest:
      type: object
      required: [projectId, text]
      properties:
        projectId: { type: string }
        text:
          type: string
          maxLength: 200000
          description: 要导入的文本，每行一条资产。请求体上限 1 MB。
    MitmProject:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string, description: 当前项目的 ID。MITM 的 POST 路由把它放在请求体里。 }
    IntelligenceCleanup:
      type: object
      properties:
        sourceId: { type: string }
        before: { type: integer, description: 毫秒时间戳，只清理这个时间之前的。 }
        after: { type: integer, description: 毫秒时间戳，只清理这个时间之后的。不能晚于 `before`。 }
