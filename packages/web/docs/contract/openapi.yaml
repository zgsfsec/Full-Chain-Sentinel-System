openapi: 3.1.0

info:
  title: 全链哨兵 Web 控制台 HTTP 接口
  version: 2.3.6
  summary: "浏览器控制台与后端之间的 HTTP 接口。WebSocket `/ws` 的消息另见 docs/contract/websocket。"
  description: |
    这份文档只覆盖 HTTP。每个请求依次经过三道门，任何一道没过都到不了接口本身：

    1. **入口串**：除了标明「不需要入口 Cookie」的路径，不带 `sentinel-gate` Cookie 的请求一律回
       `404`，正文是纯文本 `Not Found\n`。打开启动日志里的入口地址 `/<入口串>` 会得到 `302` 到 `/`，
       并下发这个 Cookie。
    2. **会话 Cookie**：`/api/*`（除登录相关的几条）和插件图标需要 `sentinel-auth` Cookie，否则回
       `401`，正文 `{"error":"未登录"}`。
    3. **授权承诺**：账号还没接受首次使用的授权承诺时，已登录的请求访问 `/api/*` 回 `403`，正文
       `{"error":"consent_required"}`。

    通用约定：

    - JSON 响应的 `Content-Type` 是 `application/json; charset=utf-8`。出错的正文都是 `{"error": "…"}`，
      `error` 是给操作员看的完整句子，按当前界面语言生成（少数路由固定为中文或英文）。
    - 没有匹配到任何路由的路径返回前端页面 `index.html`（`200`，`text/html`），这是单页应用的路由回退。
      所以对一条存在的 API 路径用了不支持的请求方法时，多数情况下得到的不是 `405`，而是 `200` 的 HTML 页面；
      只有文档里列出了 `405` 的路由会明确拒绝。
    - 路径里带查询参数 `projectId` 的路由都要求它是**当前项目**的 ID：项目在请求期间被切换时回 `409`。

    响应和请求体的精确结构不在这份文件里手写。写成 `schema: { x-schema: Http.某名称 }` 的地方，结构由后端的
    TypeScript 类型生成，`Http.某名称` 是 `docs/contract/frontend/schemas.generated.json` 里根的名字。
    `docs/contract/frontend/http-api.json` 把这两样合在一起，并带上示例，是可以导入 ApiFox 或 Postman 的那一份。

servers:
  - url: /
    description: 前端与后端同源，没有可以配置的后端地址。

security:
  - sentinel-gate: []
    sentinel-auth: []

tags:
  - name: 入口与登录
  - name: 授权承诺
  - name: 界面语言
  - name: 运行状态
  - name: 上传与下载
  - name: 项目
  - name: 模型
  - name: 报告中心
  - name: 资产库
  - name: POC
  - name: 代码情报
  - name: 守门审计
  - name: 工作链路
  - name: MITM 与 WebFuzz
  - name: 威胁情报
  - name: 安全检查
  - name: 凭据
  - name: 静态资源与插件界面
  - name: 非浏览器调用方

paths:
  /:
    get:
      tags: [静态资源与插件界面]
      summary: 控制台页面
      description: "返回前端的 `index.html`。前端是单页应用，所有未匹配到路由的路径也都回这一个文件。"
      security:
        - sentinel-gate: []
      responses:
        "200":
          description: 页面。前端还没构建时是一页说明如何构建的纯文本页面。
          content:
            text/html: {}

  /assets/swagger-ui-{file}:
    get:
      tags: [静态资源与插件界面]
      summary: 前端资源里的通用阅读器文件
      description: 业务建模的文档页在沙箱 iframe 里渲染 Swagger UI，带不上 Cookie，所以这条路径不需要入口 Cookie，也不含任何控制台数据。
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
          example: swagger-ui-bundle.js
          description: "前端构建产物里以 `swagger-ui-` 开头的文件名，实际的名字带构建哈希，例如 `swagger-ui-bundle-DtfaQRSx.js`。"
      responses:
        "200":
          description: 静态文件。
          content:
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /plugin-icon/{hostId}/{pluginId}/{file}:
    get:
      tags: [静态资源与插件界面]
      summary: 插件在侧栏里的图标
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/pluginId"
        - name: file
          in: path
          required: true
          schema: { type: string }
          example: icon.svg
          description: "图标文件名，只能是字母、数字、点、下划线、短横线，扩展名是 `svg` 或 `png`。"
      responses:
        "200":
          description: 图标本身。
          content:
            image/svg+xml: {}
            image/png: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /plugin-ui/{token}/{hostId}/{pluginId}/{assetPath}:
    get:
      tags: [静态资源与插件界面]
      summary: 插件的前端界面及其资源
      description: |-
        把请求原样转给插件主机，响应原样返回。插件界面在沙箱 iframe 里加载，带不上 Cookie，
        所以不用入口 Cookie 和会话 Cookie，改由路径里的临时令牌鉴权：令牌由 WebSocket 消息
        `plugin_ui_open` 发出，12 小时有效，只能打开它对应的那一个插件的界面。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          example: tok-example
          description: 临时令牌，由 WebSocket 消息 `plugin_ui_open` 发出。
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/pluginId"
        - name: assetPath
          in: path
          required: true
          schema: { type: string }
          example: index.html
          description: "界面里的相对路径。每一段都不能是 `.`、`..`，也不能含斜杠。"
      responses:
        "200":
          description: 插件主机返回的内容。
          content:
            application/octet-stream: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: 读不到插件主机的界面。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/state:
    get:
      tags: [入口与登录]
      summary: 账号状态
      description: 前端据此决定显示「创建管理员账号」还是登录页。
      security:
        - sentinel-gate: []
      responses:
        "200":
          description: "`configured` 表示是否已经创建过账号；`username` 在账号创建之前是 `null`。前端据此决定显示创建账号的页面还是登录页。"
          content:
            application/json:
              schema:
                type: object
                required: [configured, username]
                properties:
                  configured: { type: boolean }
                  username: { type: [string, "null"] }
              example: { configured: true, username: operator }

  /api/auth/setup:
    post:
      tags: [入口与登录]
      summary: 创建管理员账号（只在第一次）
      description: 账号只能创建一次。成功后直接下发会话 Cookie，不需要再登录。
      security:
        - sentinel-gate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
            example: { username: operator, password: change-me-please }
      responses:
        "200":
          description: "账号已创建。`Set-Cookie` 下发 `sentinel-auth`，`Max-Age` 为 30 天。"
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`sentinel-auth=<令牌>; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000`"
          content:
            application/json:
              schema:
                type: object
                required: [ok, username]
                properties:
                  ok: { type: boolean }
                  username: { type: string }
              example: { ok: true, username: operator }
        "400":
          description: 请求体不是 JSON，或用户名、密码不合格。用户名只能是字母、数字、点、下划线或连字符，最长 40 个字符；密码至少 8 个字符。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /api/auth/login:
    post:
      tags: [入口与登录]
      summary: 登录
      description: |-
        只有最新的一次登录有效：登录成功后，其它浏览器之前持有的会话 Cookie 全部失效，
        它们的 WebSocket 连接以关闭码 `4001`、原因 `session_replaced` 关闭。
        同一个来源地址连续 5 次登录失败后锁定 30 秒。
      security:
        - sentinel-gate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                remember:
                  type: boolean
                  default: true
                  description: "为 `false` 时不带 `Max-Age`，Cookie 只在浏览器会话期间有效。"
            example: { username: operator, password: change-me-please, remember: true }
      responses:
        "200":
          description: 已登录。
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`sentinel-auth=<令牌>; Path=/; HttpOnly; SameSite=Strict`，勾选记住登录时再加 `Max-Age=2592000`。"
          content:
            application/json:
              schema:
                type: object
                required: [ok, username]
                properties:
                  ok: { type: boolean }
                  username: { type: string }
              example: { ok: true, username: operator }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 用户名或密码不正确。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 还没有管理员账号。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: 尝试次数过多，稍后再试。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      tags: [入口与登录]
      summary: 退出登录
      description: "让之前签发的所有会话 Cookie 失效，并断开所有 WebSocket 连接（关闭码 `4001`、原因 `session_expired`）。请求本身没有带有效会话时只清除浏览器里的 Cookie，不影响当前的登录。"
      security:
        - sentinel-gate: []
      responses:
        "200":
          description: "已退出。`Set-Cookie` 清除 `sentinel-auth`。"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/auth/session:
    get:
      tags: [入口与登录]
      summary: 当前会话的状态
      description: "接受授权承诺之前就能访问。前端在 WebSocket 以关闭码 `4001` 断开后用它判断登录是否还有效。"
      responses:
        "200":
          description: 会话有效。
          content:
            application/json:
              schema:
                type: object
                required: [ok, username, consent]
                properties:
                  ok: { type: boolean }
                  username: { type: string }
                  consent:
                    type: object
                    required: [required, acceptedAt, version]
                    properties:
                      required:
                        type: boolean
                        description: "为 `true` 时还需要接受授权承诺。"
                      acceptedAt:
                        type: [string, "null"]
                        description: "接受的时间，ISO 8601；还没接受时是 `null`。"
                      version: { type: integer }
              example:
                ok: true
                username: operator
                consent: { required: false, acceptedAt: "2026-11-24T08:00:00.000Z", version: 2 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/change-password:
    post:
      tags: [入口与登录]
      summary: 修改密码
      description: "修改后，之前签发的所有会话 Cookie 失效，所有 WebSocket 连接以关闭码 `4001`、原因 `session_expired` 关闭；本次请求的调用者拿到一个新的会话 Cookie。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, next]
              properties:
                current: { type: string }
                next: { type: string, description: 至少 8 个字符。 }
            example: { current: change-me-please, next: a-longer-password }
      responses:
        "200":
          description: "已修改。`Set-Cookie` 下发新的 `sentinel-auth`。"
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }
        "400":
          description: 请求体不是 JSON、当前密码不正确，或新密码太短。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /api/consent:
    get:
      tags: [授权承诺]
      summary: 授权声明和当前状态
      description: 接受授权承诺之前就能访问。
      responses:
        "200":
          description: 声明全文和状态。`text` 是按当前界面语言给出的分段文字，其中的 `**` 是加粗标记，不是 HTML。
          content:
            application/json:
              schema: { x-schema: Http.ConsentStatement }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consent/accept:
    post:
      tags: [授权承诺]
      summary: 记录授权承诺
      description: 记录在服务端，带着账号名和声明文字的哈希。换了账号或声明文字改了，承诺作废。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted:
                  type: boolean
                  description: "必须是 `true`，勾选框就是这一步的意义。"
            example: { accepted: true }
      responses:
        "200":
          description: 已记录。
          content:
            application/json:
              schema:
                type: object
                required: [ok, acceptedAt, version]
                properties:
                  ok: { type: boolean }
                  acceptedAt: { type: string, description: 接受的时间，ISO 8601。 }
                  version: { type: integer }
              example: { ok: true, acceptedAt: "2026-11-24T08:00:00.000Z", version: 2 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"

  /api/ui-language:
    get:
      tags: [界面语言]
      summary: 当前界面语言
      description: 登录页和授权承诺页在建立 WebSocket 之前用它取语言。不需要会话 Cookie。
      security:
        - sentinel-gate: []
      responses:
        "200":
          description: 当前语言。
          content:
            application/json:
              schema:
                type: object
                required: [language]
                properties:
                  language: { type: string, enum: [zh, en] }
              example: { language: zh }
    post:
      tags: [界面语言]
      summary: 切换界面语言
      description: "语言是全局的。切换后向所有 WebSocket 连接广播 `ui_config`。不需要会话 Cookie。"
      security:
        - sentinel-gate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [zh, en] }
            example: { language: en }
      responses:
        "200":
          description: 已切换。
          content:
            application/json:
              schema:
                type: object
                required: [ok, language]
                properties:
                  ok: { type: boolean }
                  language: { type: string, enum: [zh, en] }
              example: { ok: true, language: en }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/health:
    get:
      tags: [运行状态]
      summary: 健康检查
      responses:
        "200":
          description: "`ok` 总是 `true`。`sessionId` 是当前选中的对话的 ID，没有时是 `null`。`mode` 是命令执行的审批方式：`review` 由操作员审批，`ai` 由守门模型判定，`auto` 直接执行。"
          content:
            application/json:
              schema:
                type: object
                required: [ok, sessionId, mode]
                properties:
                  ok: { type: boolean }
                  sessionId: { type: [string, "null"] }
                  mode: { type: string, enum: [review, ai, auto] }
              example: { ok: true, sessionId: null, mode: review }

  /api/upload:
    post:
      tags: [上传与下载]
      summary: 对话附件上传
      description: "请求体是文件的原始字节，不是 multipart。文件写进当前项目工作目录的 `uploads/`，重名时自动加 `-2`、`-3`。单文件上限 1 GB。上传中断或超限时删掉写了一半的文件。"
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: notes.txt
          description: "文件名。服务端只取最后一段，`../../evil.sh` 变成 `evil.sh`。"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: "`name` 是落盘的文件名，重名时带上了 `-2` 这样的后缀。`path` 是文件在工作目录里的绝对路径，`size` 是字节数。"
          content:
            application/json:
              schema:
                type: object
                required: [ok, name, path, size]
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  path: { type: string }
                  size: { type: integer }
              example: { ok: true, name: notes.txt, path: /work/uploads/notes.txt, size: 12 }
        "400":
          description: 上传中断。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 还没有选中项目，或者查询参数里的项目不是当前项目。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: 超过 1 GB。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/Internal"

  /api/pocs/import:
    post:
      tags: [POC]
      summary: 上传 POC 包
      description: |-
        请求体是 zip 或 YAML 文件的原始字节，上限 512 MiB。服务端只返回一张受理回执，
        解析在后台排队进行，进度用 `/api/pocs/import/{id}` 轮询。同时排队和运行中的任务最多 8 个。
      parameters:
        - name: name
          in: query
          schema: { type: string, default: poc.zip }
          example: poc.zip
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: "已受理。`id` 是导入任务的 ID，用它轮询 `/api/pocs/import/{id}`。"
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
              example: { ok: true, id: "6f1c2a3e-8b4d-4c2a-9f1e-2d3c4b5a6978" }
        "413":
          description: 超过大小上限。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: 排队的导入任务太多。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/pocs/import/{id}:
    get:
      tags: [POC]
      summary: POC 导入任务的状态
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: "6f1c2a3e-8b4d-4c2a-9f1e-2d3c4b5a6978"
      responses:
        "200":
          description: "任务状态。`status` 是 `queued`、`running`、`done` 或 `error`；`progress` 是实时计数；`outcome` 在 `done` 时给出导入了多少、替换了多少、跳过了哪些及原因；`error` 在 `error` 时给出原因。"
          content:
            application/json:
              schema: { x-schema: Http.PocImportJob }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/folder-archives/{id}:
    get:
      tags: [上传与下载]
      summary: 下载打包好的文件夹
      description: "由 WebSocket 消息 `download_folder` 发起打包，打包完成后用回执里的 `id` 下载。一个压缩包同一时间只能被一个请求下载。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: "6f1c2a3e-8b4d-4c2a-9f1e-2d3c4b5a6978"
      responses:
        "200":
          description: tar.gz 文件流。
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/gzip: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 压缩包不存在或已过期。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 压缩包还在生成，或正在被另一个请求下载。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/rename:
    post:
      tags: [项目]
      summary: 项目改名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, description: 项目的 ID。 }
                name: { type: string, description: 新名字。 }
            example: { id: project-1, name: 内网渗透 }
      responses:
        "200":
          description: "已改名。同时向所有 WebSocket 连接广播新的 `projects` 列表。"
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
              example: { id: project-1, name: 内网渗透 }
        "400":
          description: 请求体不合格，或新名字不被接受。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "405":
          description: 只接受 POST。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/projects/egress-ip:
    get:
      tags: [项目]
      summary: 项目最近一次测得的出口 IP
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "没测过时 `result` 是 `null`；测过时是 `ip`、`location` 和测试时间 `testedAt`（毫秒时间戳）。"
          content:
            application/json:
              schema: { x-schema: Http.EgressIpResult }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [项目]
      summary: 测试项目的出口 IP
      description: 用项目自己的出口真实访问一次外部服务。
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: 测试结果，`result` 里有 `ip`、`location` 和 `testedAt`（毫秒时间戳）。
          content:
            application/json:
              schema: { x-schema: Http.EgressIpResult }
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: 只接受 GET 和 POST。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "测试失败，`error` 是原因。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/models/remote:
    post:
      tags: [模型]
      summary: 拉取远端模型列表
      description: 用尚未保存的端点配置去查询服务商的模型列表。只读，不写任何配置，响应里不带回密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, api, apiKey]
              properties:
                baseUrl: { type: string }
                api:
                  type: string
                  description: "接口协议。不在允许列表里时回 `400`。"
                  enum: [openai-completions, openai-responses, anthropic-messages, google-generative-ai]
                apiKey:
                  type: [string, "null"]
                  description: "为 `null` 时复用 `entryId` 对应的模型已经保存的密钥。"
                entryId: { type: string, description: "复用密钥的那个模型条目的 ID，和 `apiKey: null` 配合使用。" }
            example: { baseUrl: "https://api.example.com/v1", api: openai-completions, apiKey: "sk-example", entryId: entry-1 }
      responses:
        "200":
          description: "模型列表。`models` 每项有 `id` 和 `name`；服务商返回的条数超过上限时 `truncated` 为 `true`。"
          content:
            application/json:
              schema: { x-schema: Http.RemoteModelList }
        "400":
          description: 请求体不合格、JSON 格式错误，或拉取失败。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: 只接受 POST。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/code-monitors/project:
    get:
      tags: [代码情报]
      summary: 项目的代码情报总开关
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: 当前状态。
          content:
            application/json:
              schema:
                type: object
                required: [projectId, enabled]
                properties:
                  projectId: { type: string }
                  enabled: { type: boolean }
              example: { projectId: project-1, enabled: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [代码情报]
      summary: 设置项目的代码情报总开关
      description: 只改开关，仓库配置和历史记录不动。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
            example: { enabled: false }
      responses:
        "200":
          description: 已保存。
          content:
            application/json:
              schema:
                type: object
                required: [projectId, enabled]
                properties:
                  projectId: { type: string }
                  enabled: { type: boolean }
              example: { projectId: project-1, enabled: false }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: 只接受 GET 和 POST。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/gate-audit/export:
    get:
      tags: [守门审计]
      summary: 导出守门判定记录
      description: 导出 CSV，表头按当前界面语言给出。
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          example: '{"decision":"block"}'
          description: "值是一个 JSON 对象，发送前 URL 编码。字段和 WebSocket 消息 `gate_audit_query` 的 `filter` 字段相同：`decision`（`allow`、`block`、`failed`）、`projectId`、`sessionId`、`source`、`approval`、`search`、`since`。"
      responses:
        "200":
          description: CSV 文件。
          content:
            text/csv: {}
        "400":
          description: 筛选条件无效。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: 只接受 GET。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/Internal"

  /api/assets/import:
    get:
      tags: [资产库]
      summary: 当前项目
      description: 资产导入对话框用它确认导入到哪个项目。
      responses:
        "200":
          description: 当前项目。前端可以用它拿到当前项目的 `id`。
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
              example: { id: project-1, name: 内网渗透 }
        "409":
          description: 还没有选中项目。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [资产库]
      summary: 批量导入资产
      description: "导入后向所有 WebSocket 连接广播 `assets_changed`。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetImportRequest" }
            example:
              projectId: project-1
              text: |
                example.com
                10.0.0.1
      responses:
        "200":
          description: "导入结果。`created` 是新建的条数，`merged` 是并入已有资产的条数，`duplicates` 是文本里重复的条数，`invalid` 是无法识别的条数。"
          content:
            application/json:
              schema: { x-schema: Http.AssetImportResult }
        "400":
          description: 请求体不合格，或导入内容不是有效的资产。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 当前项目已切换。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/assets/import/preview:
    post:
      tags: [资产库]
      summary: 预览批量导入
      description: "只解析，不写入。`items` 是每一条会被导入的资产和它的类型、名字、是否已存在；`invalid` 是无法识别的行及原因；另有 `created`、`merged`、`duplicates` 三个计数。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetImportRequest" }
            example:
              projectId: project-1
              text: |
                example.com
                10.0.0.1
      responses:
        "200":
          description: 预览结果。
          content:
            application/json:
              schema: { x-schema: Http.AssetImportPreview }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/assets/remarks:
    post:
      tags: [资产库]
      summary: 给一批资产写备注
      description: "`ids` 是 WebSocket 消息 `list_assets` 返回的资产 ID，必须都属于当前项目。改完后向所有 WebSocket 连接广播 `assets_changed`。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, ids, remark, mode]
              properties:
                projectId: { type: string }
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                remark: { type: string }
                mode: { type: string, enum: [append, replace], description: "`append` 追加到已有备注之后，`replace` 覆盖。" }
            example: { projectId: project-1, ids: [asset-1], remark: 已确认, mode: append }
      responses:
        "200":
          description: 改了多少条。
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
              example: { count: 1 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 还没接受授权承诺。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: 只接受 POST。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/reports:
    get:
      tags: [报告中心]
      summary: 报告列表
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: source
          in: query
          schema: { type: string, enum: [session, goal, engine] }
          example: session
          description: 不传表示全部来源。
        - name: search
          in: query
          schema: { type: string }
          example: 内网
          description: 按标题模糊匹配，只看前 200 个字符。
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          example: 1
      responses:
        "200":
          description: "一页报告。`items` 是摘要，每项有 `id`、`title`、`createdAt`、`size`（字节）、`imageCount`、`projectId`、`projectName`、`source`（`session`、`goal` 或 `engine`），以及它属于哪次对话或哪个工程任务的 `sessionId`、`sessionName`、`engineId`、`engineName`、`taskId`、`taskName`、`goalId`，和生成时套用的模板快照 `reportTemplate`（`null` 表示没套模板）。`total`、`page`、`pageSize` 是分页信息。"
          content:
            application/json:
              schema: { x-schema: Http.ReportPage }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 项目不存在。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/Internal"

  /api/reports/{id}:
    parameters:
      - $ref: "#/components/parameters/reportId"
    get:
      tags: [报告中心]
      summary: 报告详情
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "报告全文：在列表项的字段之外多了 `markdown`（正文）、`revision`（版本号，保存时要带回）、`images`（归档的图片）和 `attachments`（附件）。"
          content:
            application/json:
              schema: { x-schema: Http.ReportDetail }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [报告中心]
      summary: 保存报告的标题和正文
      description: 带版本号，防止两个人的修改互相覆盖。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, markdown, revision]
              properties:
                title: { type: string, description: 报告标题。 }
                markdown: { type: string, description: Markdown 正文。 }
                revision:
                  type: string
                  description: 打开编辑时拿到的版本号。
            example:
              title: 内网渗透测试报告
              markdown: |
                # 概述

                ## 发现

                ## 结论
              revision: "1"
      responses:
        "200":
          description: 保存后的报告，`revision` 已经是新版本号。
          content:
            application/json:
              schema: { x-schema: Http.ReportUpdated }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 报告已被别人修改，或项目已删除。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [报告中心]
      summary: 删除报告
      description: 请求头 `Content-Type` 必须是 `application/json`（请求体可以是空对象），否则回 `415`。
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: {}
      responses:
        "200":
          description: 是否删掉了。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/reports/{id}/download:
    get:
      tags: [报告中心]
      summary: 下载报告
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/projectId"
        - name: format
          in: query
          schema: { type: string, enum: [md] }
          example: md
          description: "为 `md` 时下载单个 Markdown 文件；不传时下载 ZIP 包，里面有正文、图片和附件。"
      responses:
        "200":
          description: 文件流。
          content:
            application/zip: {}
            text/markdown: {}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 登录、授权或项目已失效。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/reports/{id}/images/{image}:
    get:
      tags: [报告中心]
      summary: 报告里归档的一张图片
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/projectId"
        - name: image
          in: path
          required: true
          schema: { type: string }
          example: 6f1c2a3e-8b4d-4c2a-9f1e-2d3c4b5a6978.png
      responses:
        "200":
          description: "图片本身，`Content-Type` 是图片自己的类型。"
          content:
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/templates:
    get:
      tags: [报告中心]
      summary: 报告模板列表
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
          example: project-1
          description: 传了就一并返回这个项目的默认模板。
      responses:
        "200":
          description: "模板是全局共享的。`items` 每项有 `id`、`name`、`markdown`、`revision`、`createdAt` 和 `updatedAt`；`defaultTemplateId` 是查询参数里那个项目的默认模板 ID，没传项目或没设置时是 `null`。"
          content:
            application/json:
              schema: { x-schema: Http.ReportTemplateList }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [报告中心]
      summary: 新建报告模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, markdown]
              properties:
                name: { type: string, description: 模板名称，1–120 个字符的单行文字。 }
                markdown: { type: string, description: Markdown 正文，最大 64 KB。 }
            example:
              name: 渗透测试报告
              markdown: |
                # 概述

                ## 测试范围

                ## 发现

                ## 修复建议
      responses:
        "201":
          description: 新建的模板。
          content:
            application/json:
              schema: { x-schema: Http.ReportTemplate }
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/reports/templates/default:
    put:
      tags: [报告中心]
      summary: 设置项目的默认报告模板
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: [string, "null"]
                  description: "为 `null` 表示取消默认模板。"
            example: { templateId: tpl-1 }
      responses:
        "200":
          description: 已设置。
          content:
            application/json:
              schema:
                type: object
                required: [defaultTemplateId]
                properties:
                  defaultTemplateId: { type: [string, "null"] }
              example: { defaultTemplateId: tpl-1 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/reports/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        example: tpl-1
        description: "模板 ID。`default` 是保留字，见上一条路径。"
    get:
      tags: [报告中心]
      summary: 报告模板详情
      responses:
        "200":
          description: 模板，有 `id`、`name`、`markdown`、`revision`、`createdAt` 和 `updatedAt`。
          content:
            application/json:
              schema: { x-schema: Http.ReportTemplate }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [报告中心]
      summary: 修改报告模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, markdown, revision]
              properties:
                name: { type: string }
                markdown: { type: string }
                revision: { type: string, description: 打开模板时拿到的版本号。 }
            example:
              name: 渗透测试报告
              markdown: |
                # 概述

                ## 测试范围

                ## 发现

                ## 修复建议

                ## 复测结果
              revision: "1"
      responses:
        "200":
          description: 保存后的模板，`revision` 已经是新版本号。
          content:
            application/json:
              schema: { x-schema: Http.ReportTemplate }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
