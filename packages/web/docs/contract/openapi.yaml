  /api/mitm:
    get:
      tags: [MITM 与 WebFuzz]
      summary: MITM 代理的状态
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: "状态。`state` 是 `unavailable`、`running`、`missing` 或 `stopped`；`project` 是 `{ id, name }`；`config` 是当前配置（`bind`、`port`、`skipStatic`、`maxCaptureMb`、`maxConnections`、`authEnabled`、`authUsername`、`hasPassword`，密码本身不返回）；`port` 是代理实际监听的端口，没在运行时是 `null`；`lanIps` 是可以填进代理设置的局域网地址；`ca` 是 HTTPS 解密证书的 `fingerprint`、`subject` 和 `expires`，没有时是 `null`；`error` 在启动失败时给出原因。"
          content:
            application/json:
              schema: { x-schema: Http.MitmStatus }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/mitm/config:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 保存 MITM 代理配置
      description: |-
        配置字段和 `projectId` 平铺在请求体的同一层，都可以省略，省略的沿用当前值：`bind`（`127.0.0.1` 或 `0.0.0.0`）、`port`（0–65535，`0` 表示自动分配）、
        `skipStatic`（是否不保存静态资源的报文）、`maxCaptureMb`（单个请求或响应保存的上限，1–32 MB）、`maxConnections`（同时连接的上限，1–1024）、
        `authEnabled` 和 `authUsername`（代理的访问控制，启用时账号必填），以及 `password`（只在设置或修改代理密码时发送，8–128 位可见 ASCII 字符）。

        代理在运行时保存会重启代理。
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-schema: Http.MitmConfigInput }
            example:
              projectId: project-1
              bind: 127.0.0.1
              port: 8080
              skipStatic: true
              maxCaptureMb: 16
              maxConnections: 64
              authEnabled: false
              password: proxy-secret
      responses:
        "200":
          description: 保存后的状态。
          content:
            application/json:
              schema: { x-schema: Http.MitmStatus }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/start:
    post:
      tags: [MITM 与 WebFuzz]
      summary: 启动 MITM 代理
      requestBody:
