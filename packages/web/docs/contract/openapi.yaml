                  ok: { type: boolean }
                  deleted: { type: integer }
              example: { ok: true, deleted: 1 }
        "400":
          $ref: "#/components/responses/MitmInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MitmProjectChanged"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/MitmFailed"
        "503":
          $ref: "#/components/responses/MitmUnavailable"
  /api/mitm/ca.pem:
